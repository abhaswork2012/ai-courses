<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Products</title>
  <style>
    .product-list { list-style: none; padding: 0; }
    .product-row { padding: 8px 12px; }
    .row-odd { background: #ffffff; }
    .row-even { background: #f0f0f0; }
    .row-number { display: inline-block; width: 2em; color: #666666; }
    .badge-sold-out { margin-left: 8px; padding: 2px 6px; background: #c62828; color: #ffffff; font-size: 12px; }
    .badge-low-stock { margin-left: 8px; padding: 2px 6px; background: #ef6c00; color: #ffffff; font-size: 12px; }
    .empty-state { color: #666666; }
  </style>
</head>
<body>
  <h1>Products</h1>
  {# Write your code here #}
  {% if products %}
  <ul class="product-list">
  {% for product in products %}
  <li class="product-row {% if forloop.counter|divisibleby:2 %}row-even{% else %}row-odd{% endif %}"><span class="row-number">{{forloop.counter}}</span> <span class="product-name">{{product.name}}</span> {% include "app/stock_badge.html" %}</li>
  {% endfor %}
  </ul>
  {% else %}
  <h3 class="empty-state">No products available.</h3>
  {% endif %}
</body>
</html>
