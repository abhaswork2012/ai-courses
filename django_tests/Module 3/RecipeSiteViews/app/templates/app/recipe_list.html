<!DOCTYPE html>
<html>
<head><title>Recipes</title></head>
<body>
<h1>Recipes</h1>
<ul>
{% for recipe in recipes %}
  <li>
    <a href="{% url 'recipes:recipe-detail' recipe.slug %}">{{ recipe.title }}</a>
    (<a href="{% url 'recipes:recipe-archive' recipe.year %}">{{ recipe.year }}</a>)
  </li>
{% endfor %}
</ul>
</body>
</html>
