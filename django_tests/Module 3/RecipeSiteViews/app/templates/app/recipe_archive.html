<!DOCTYPE html>
<html>
<head><title>Recipes from {{ year }}</title></head>
<body>
<h1>Recipes from {{ year }}</h1>
<ul>
{% for recipe in recipes %}
  <li><a href="{% url 'recipes:recipe-detail' recipe.slug %}">{{ recipe.title }}</a></li>
{% endfor %}
</ul>
<p><a href="{% url 'recipes:recipe-list' %}">All recipes</a></p>
</body>
</html>
