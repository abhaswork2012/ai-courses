<!DOCTYPE html>
<html>
<head><title>Posts from {{ year }}</title></head>
<body>
<h1>Posts from {{ year }}</h1>
<ul>
{% for post in posts %}
  <li><a href="{% url 'blog:post-detail' post.year post.slug%}">{{ post.title }}</a></li>
{% endfor %}
</ul>
<a href="{% url 'blog:post-list' %}">All posts</a>
</body>
</html>
