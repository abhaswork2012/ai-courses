<!DOCTYPE html>
<html>
<head><title>Posts</title></head>
<body>
<h1>Posts</h1>
<ul>
{% for post in posts %}
  <li>
    <a href="{% url 'blog:post-detail' post.year post.slug%}">{{ post.title }}</a>
    (<a href="{% url 'blog:post-archive' post.year %}">{{ post.year }}</a>)
  </li>
{% endfor %}
</ul>
</body>
</html>
